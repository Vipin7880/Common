<header [class.scrolled]="isScrolled" [class.solid-header]="!isHome">
  <div class="container header-container">
    <div class="logo">
      <a routerLink="/"><img src="assets/images/logo.png" alt="GeePee Network"></a>
    </div>

    <div class="mobile-toggle" (click)="toggleMenu()">
      <span class="slicknav_icon">
        <span class="slicknav_icon-bar"></span>
        <span class="slicknav_icon-bar"></span>
        <span class="slicknav_icon-bar"></span>
      </span>
    </div>

    <nav [class.active]="isMenuOpen">
      <ul>
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
            (click)="isMenuOpen=false">Home</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="isMenuOpen=false">About</a></li>
        <li><a routerLink="/services" routerLinkActive="active" (click)="isMenuOpen=false">Services</a></li>
        <li><a routerLink="/portfolio" routerLinkActive="active" (click)="isMenuOpen=false">Portfolio</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="isMenuOpen=false">Contact</a></li>
        <li class="cta-item"><a routerLink="/contact" class="btn btn-gold" (click)="isMenuOpen=false">Get Quote</a></li>
      </ul>
    </nav>
  </div>
</header>
