<div class="card h-100 shadow-sm feature-card hover-lift">
    <img *ngIf="image" [src]="image" [alt]="title" class="card-img-top" style="height: 150px; object-fit: cover;">

    <div class="card-body p-3 d-flex flex-column h-100">
        <div class="mb-2 d-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 text-primary"
            style="width: 48px; height: 48px;" *ngIf="!image">
            <i class="bi {{icon}} fs-4"></i>
        </div>

        <h5 class="card-title fw-bold mb-2">{{title}}</h5>
        <p class="card-text text-secondary mb-3 flex-grow-1 small">{{description}}</p>

        <div class="mb-3" *ngIf="tags.length > 0">
            <span class="badge bg-light text-secondary me-2 mb-1 fw-normal border"
                *ngFor="let tag of tags">{{tag}}</span>
        </div>

        <a [routerLink]="link" [queryParams]="queryParams"
            class="btn btn-outline-primary btn-sm stretched-link rounded-pill fw-bold">{{linkText}}
            <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
</div>
