<div class="pt-5 pb-5" style="background-image: linear-gradient(rgba(0, 33, 71, 0.85), rgba(0, 33, 71, 0.95)), url('assets/images/hero-bg.png'); background-size: cover; background-position: center;">
    <div class="container pt-4">
        <div class="row align-items-end mb-4">
            <div class="col-lg-8">
                <span class="d-inline-block py-2 px-3 rounded-pill bg-white bg-opacity-10 text-white fw-bold text-uppercase small mb-3" style="letter-spacing: 1px;">Expertise</span>
                <h1 class="display-4 fw-bold text-white mb-3">Our <span style="color: var(--secondary-color);">Services</span></h1>
                <p class="text-white-50 lead mb-0" style="max-width: 600px;">Helping ambitious businesses transform with cutting-edge technology, scalable architectures, and digital strategies.</p>
            </div>
        </div>
    </div>
</div>

<div class="container py-5 mt-2">
    <div class="row g-4 row-cols-1 row-cols-lg-2 row-cols-xl-3">
        <div class="col" *ngFor="let service of services">
            <div class="service-card card h-100 border-0 rounded-4 shadow-sm p-4 hover-lift position-relative overflow-hidden bg-white d-flex flex-column">
                
                <!-- Decorative background shape -->
                <div class="position-absolute top-0 end-0 bg-light opacity-50" style="width: 150px; height: 150px; transform: translate(30%, -30%); border-radius: 50%; pointer-events: none;"></div>
                
                <div class="d-flex align-items-center mb-4 position-relative z-index-1">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 shadow-sm flex-shrink-0 me-3" style="width: 60px; height: 60px;">
                        <i class="bi {{service.icon}} fs-3"></i>
                    </div>
                    <h3 class="fw-bold fs-4 mb-0 text-dark">{{service.title}}</h3>
                </div>
                
                <p class="text-secondary mb-4 position-relative z-index-1 flex-grow-1">{{service.desc}}</p>
                
                <div class="d-flex flex-wrap gap-2 mb-4 position-relative z-index-1">
                    <span class="badge bg-light text-dark fw-medium border px-3 py-2 rounded-pill" *ngFor="let feature of service.features">
                        {{feature}}
                    </span>
                </div>
                
                <div class="mt-auto position-relative z-index-1">
                    <a routerLink="/contact" class="btn btn-outline-primary w-100 rounded-pill fw-bold service-btn">Consult with us <i class="bi bi-arrow-right ms-1"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>
