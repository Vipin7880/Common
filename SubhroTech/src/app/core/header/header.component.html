<header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/" (click)="closeMenu()">
            <img src="assets/logo.png" alt="Subhro Tech Logo" height="40" class="d-inline-block align-text-top">
            <span class="text-white">Subhro<span class="text-gradient">Tech</span></span>
        </a>
        <button class="navbar-toggler" type="button" (click)="toggleMenu()" [attr.aria-expanded]="!isMenuCollapsed"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" [class.show]="!isMenuCollapsed" id="navbarNav">
            <ul class="navbar-nav gap-lg-3">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/services" routerLinkActive="active"
                        (click)="closeMenu()">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/domains" routerLinkActive="active"
                        (click)="closeMenu()">Internships</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/contact" routerLinkActive="active"
                        (click)="closeMenu()">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/verify" routerLinkActive="active" (click)="closeMenu()">Verify
                        Certificate</a>
                </li>
            </ul>
            <div class="ms-lg-3 mt-2 mt-lg-0">
                <a class="btn btn-primary rounded-pill px-4" routerLink="/domains" (click)="closeMenu()">Get Started</a>
            </div>
        </div>
    </div>
</header>
