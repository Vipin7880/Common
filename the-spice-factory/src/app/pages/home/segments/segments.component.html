<section class="sf-segments section">
  <div class="container">
    <div class="section-header">
      <span class="section-subtitle">Discover</span>
      <h2 class="section-title">Our Business Segments</h2>
      <div class="section-divider"></div>
      <p class="section-description">
        We serve three distinct channels with premium herbs, spices, and seasonings — 
        each tailored to meet specific quality and packaging standards.
      </p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let seg of segments; let i = index">
        <div class="segment-card" [style.--accent]="seg.color"
             [style.animation-delay]="(i * 0.15) + 's'">
          <div class="segment-card__icon-wrap">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="seg.icon"/>
            </svg>
          </div>
          <h3 class="segment-card__title">{{ seg.title }}</h3>
          <p class="segment-card__text">{{ seg.description }}</p>
          <a [routerLink]="seg.link" class="segment-card__link">
            Learn More
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
