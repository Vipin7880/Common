<section class="sf-certificates section">
  <div class="container">
    <div class="section-header">
      <span class="section-subtitle">Trust & Quality</span>
      <h2 class="section-title">Our Certifications</h2>
      <div class="section-divider"></div>
      <p class="section-description">
        We hold the highest international quality and food safety certifications,
        ensuring every product meets premium standards.
      </p>
    </div>

    <div class="cert-grid">
      <div class="cert-item" *ngFor="let cert of certificates; let i = index"
           [style.animation-delay]="(i * 0.1) + 's'">
        <div class="cert-item__icon">
          <img [src]="cert.icon" [alt]="cert.name" width="32" height="32">
        </div>
        <span class="cert-item__name">{{ cert.name }}</span>
      </div>
    </div>
  </div>
</section>
